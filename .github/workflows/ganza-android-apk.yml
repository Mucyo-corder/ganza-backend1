name: GANZA Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/ganza-android-apk.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install required Android packages
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          NDK_VERSION="27.1.12297006"
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"

          sdkmanager --sdk_root="$SDK_ROOT"             "platforms;android-36"             "build-tools;36.0.0"             "cmake;3.22.1"

          for attempt in 1 2 3 4; do
            echo "Installing NDK $NDK_VERSION (attempt $attempt/4)..."
            rm -rf "$NDK_DIR" "$SDK_ROOT/.temp"

            if sdkmanager --sdk_root="$SDK_ROOT" "ndk;$NDK_VERSION"; then
              if [ -f "$NDK_DIR/source.properties" ]; then
                echo "NDK $NDK_VERSION installed successfully."
                break
              fi
            fi

            if [ "$attempt" -eq 4 ]; then
              echo "NDK installation failed after 4 attempts."
              exit 1
            fi

            echo "NDK installation failed. Retrying in 10 seconds..."
            sleep 10
          done

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Prepare Android
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > mobile/android/local.properties
          chmod +x mobile/android/gradlew

      - name: Build GANZA Release APK
        working-directory: mobile/android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \


      - name: Verify APK
        run: |
          test -s mobile/android/app/build/outputs/apk/release/app-release.apk
          ls -lh mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload GANZA APK
        uses: actions/upload-artifact@v4
        with:
          name: GANZA-Android-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
