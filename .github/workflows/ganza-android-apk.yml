name: GANZA Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "mobile/**"
      - ".github/workflows/ganza-android-apk.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install required Android packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.1.12297006"

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Prepare Android
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > mobile/android/local.properties
          chmod +x mobile/android/gradlew

      - name: Generate autolinking
        working-directory: mobile/android
        run: ./gradlew :app:generateAutolinkingPackageList --no-daemon --max-workers=2

      - name: Build GANZA Release APK
        working-directory: mobile/android
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify APK
        run: |
          test -s mobile/android/app/build/outputs/apk/release/app-release.apk
          ls -lh mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload GANZA APK
        uses: actions/upload-artifact@v4
        with:
          name: GANZA-Android-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
